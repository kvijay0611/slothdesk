[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slothdesk"
version = "0.1.0"
description = "A slow, private, overnight file tidier powered by a local open-weight model (Ollama)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # standard library only on purpose: fewer supply-chain risks

[project.optional-dependencies]
pdf = ["pypdf>=4,<7"]
idle = ["psutil>=5.9,<8"]
ocr = ["rapidocr-onnxruntime>=1.3,<2", "pypdfium2>=4,<6", "pillow>=10"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
slothdesk = "slothdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=slothdesk --cov-report=term-missing --cov-fail-under=85"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"evaluation/*" = ["S"]
"evaluation/corpus.py" = ["S", "E501"]
"evaluation/corpus_heldout.py" = ["S", "E501"]
